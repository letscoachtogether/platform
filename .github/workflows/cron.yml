name: Session reminders / keep-alive

# Calls the app's /api/cron/session-reminders endpoint on a schedule.
# Two jobs in one: it triggers the reminder check directly (rather than
# depending on the app's own internal setInterval having survived a
# spin-down/restart), and on hosts that sleep when idle (Render's free
# tier), the request itself counts as traffic and resets the inactivity
# timer — no separate keep-alive ping needed.
#
# Setup (once): in this repo's GitHub Settings -> Secrets and variables ->
# Actions, add two repository secrets:
#   APP_URL      e.g. https://your-app.onrender.com  (no trailing slash)
#   CRON_SECRET  the same value as the CRON_SECRET env var on your deploy
#                (Render: Environment tab -> CRON_SECRET; auto-generated by
#                the Blueprint on first deploy, or by `npm run setup` locally)
#
# Until those secrets are set, this runs on schedule but skips the actual
# ping and succeeds as a no-op — so a fresh fork of the template (which
# has no deployment yet) doesn't get a failure-email every 10 minutes.
# Once you add both secrets, it starts pinging your real deployment
# automatically, no other change needed.
#
# cron-job.org's free plan times out after 30s, which is often shorter than
# a cold Render instance's wake-up time (~50s) — GitHub Actions' default
# per-step timeout is far more generous, so a cold start doesn't look like
# a failure here the way it can there.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      APP_URL: ${{ secrets.APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Call /api/cron/session-reminders
        if: ${{ env.APP_URL != '' && env.CRON_SECRET != '' }}
        run: |
          curl --fail-with-body --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/session-reminders"

      - name: Skipped — APP_URL/CRON_SECRET not configured yet
        if: ${{ env.APP_URL == '' || env.CRON_SECRET == '' }}
        run: |
          echo "APP_URL and/or CRON_SECRET repo secrets aren't set — nothing to ping yet. See the setup comment at the top of this file."
